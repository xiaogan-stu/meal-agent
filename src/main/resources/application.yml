spring:
  application:
    name: diet-agent
  datasource:
    url: jdbc:mysql://localhost:3306/diet_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.diet.model
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8080

agentscope:
  dashscope:
    api-key: ${DASHSCOPE_API_KEY}

diet:
  llm:
    main-model: qwen-flash
    light-model: qwen-flash
  session:
    max-history-turns: 10
  evaluation:
    # 默认关闭。仅运行 evaluation/ 下的故障注入评测时显式开启。
    fault-injection-enabled: ${DIET_EVALUATION_FAULT_INJECTION_ENABLED:false}

logging:
  level:
    com.diet: INFO
